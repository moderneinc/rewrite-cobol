type: specs.openrewrite.org/v1beta/example
recipeName: org.openrewrite.cobol.search.FindCopybook
examples:
- description: '`FindCopybookTest#isUsedInCopyStatement`'
  parameters:
  - INCEPTION
  - 'false'
  sources:
  - before: |
      000000 IDENTIFICATION DIVISION.                                         *
             PROGRAM-ID. IC109A.                                              *
             DATA DIVISION.                                                   *
             LINKAGE SECTION.                                                 *
                 01  GRP-01.                                                  *
                     COPY INCEPTION.                                          *
    after: |
      000000 IDENTIFICATION DIVISION.                                         *
             PROGRAM-ID. IC109A.                                              *
             DATA DIVISION.                                                   *
             LINKAGE SECTION.                                                 *
                 01  GRP-01.                                                  *
                     COPY ~~>INCEPTION.                                          *
    language: cobol
